# ==============================================================================
# Nginx Reverse Proxy Configuration for Sentry Self-Hosted
# Đặt file này vào /etc/nginx/sites-available/sentry.conf và symlink sang sites-enabled/
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sentry.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name sentry.yourdomain.com;

    # SSL Certificates (Let's Encrypt hoặc chứng chỉ nội bộ)
    ssl_certificate /etc/letsencrypt/live/sentry.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentry.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (Tùy chọn khuyến nghị cho HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kích thước body upload tối đa: Rất quan trọng khi upload Source Maps, debug symbols, crash dumps
    client_max_body_size 100M;

    # Proxy buffers
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    location / {
        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (dành cho tính năng live logs và real-time update của Sentry)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
