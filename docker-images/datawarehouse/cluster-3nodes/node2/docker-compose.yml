networks:
  dwh-network:
    name: dwh-network
    driver: bridge

volumes:
  clickhouse_data:
    name: dwh_cluster_clickhouse_data_node2
  clickhouse_logs:
    name: dwh_cluster_clickhouse_logs_node2

secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt

services:
  # ========================================================
  # CLICKHOUSE NODE 2 - Server + Keeper Raft 02
  # ========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: dwh-clickhouse-node2
    hostname: node-db-02
    restart: unless-stopped
    network_mode: host
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dwh_user
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    secrets:
      - clickhouse_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config.d:/etc/clickhouse-server/config.d:ro

  # ========================================================
  # HAPROXY - Load Balancer cho cụm ClickHouse
  # ========================================================
  haproxy:
    image: haproxy:2.8-alpine
    container_name: dwh-haproxy-node2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # ========================================================
  # KEEPALIVED - Quản lý VIP 192.168.56.110
  # ========================================================
  keepalived:
    build:
      context: ./keepalived
    container_name: dwh-keepalived-node2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    volumes:
      - ./keepalived/keepalived.conf:/etc/keepalived/keepalived.conf:ro
      - ./keepalived/check_haproxy.sh:/etc/keepalived/check_haproxy.sh:ro
