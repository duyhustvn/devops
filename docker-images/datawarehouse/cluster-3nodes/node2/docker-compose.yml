networks:
  dwh-network:
    name: dwh-network
    driver: bridge

volumes:
  clickhouse_data:
    name: dwh_cluster_clickhouse_data_node2
  clickhouse_logs:
    name: dwh_cluster_clickhouse_logs_node2

secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt

services:
  # ========================================================
  # CLICKHOUSE NODE 2 - Server + Keeper Raft 02
  # ========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: dwh-clickhouse-node2
    hostname: node-02
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP Client
      - "9000:9000"   # Native TCP Client
      - "9009:9009"   # Interserver Replication
      - "9181:9181"   # Keeper TCP
      - "9234:9234"   # Keeper Raft
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dwh_user
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    secrets:
      - clickhouse_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config.d:/etc/clickhouse-server/config.d:ro
    networks:
      - dwh-network
