global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  300000ms
    timeout server  300000ms

# ========================================================
# STATS DASHBOARD (Giám sát trạng thái 3 node)
# ========================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

# ========================================================
# CLICKHOUSE HTTP LOAD BALANCER (Port 8124 -> 8123)
# ========================================================
frontend clickhouse_http_front
    bind *:8124
    mode http
    default_backend clickhouse_http_back

backend clickhouse_http_back
    mode http
    balance roundrobin
    option httpchk GET /ping
    http-check expect status 200
    server node-db-01 192.168.56.111:8123 check inter 2000ms fall 2 rise 2
    server node-db-02 192.168.56.112:8123 check inter 2000ms fall 2 rise 2
    server node-db-03 192.168.56.113:8123 check inter 2000ms fall 2 rise 2

# ========================================================
# CLICKHOUSE NATIVE TCP LOAD BALANCER (Port 9001 -> 9000)
# ========================================================
frontend clickhouse_tcp_front
    bind *:9001
    mode tcp
    default_backend clickhouse_tcp_back

backend clickhouse_tcp_back
    mode tcp
    balance roundrobin
    option httpchk GET /ping
    http-check expect status 200
    server node-db-01 192.168.56.111:9000 check port 8123 inter 2000ms fall 2 rise 2
    server node-db-02 192.168.56.112:9000 check port 8123 inter 2000ms fall 2 rise 2
    server node-db-03 192.168.56.113:9000 check port 8123 inter 2000ms fall 2 rise 2
