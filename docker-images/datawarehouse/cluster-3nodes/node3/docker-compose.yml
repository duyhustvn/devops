networks:
  dwh-network:
    name: dwh-network
    driver: bridge

volumes:
  clickhouse_data:
    name: dwh_cluster_clickhouse_data_node3
  clickhouse_logs:
    name: dwh_cluster_clickhouse_logs_node3

secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt

services:
  # ========================================================
  # CLICKHOUSE NODE 3 - Server + Keeper Raft 03
  # ========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: dwh-clickhouse-node3
    hostname: node-db-03
    restart: unless-stopped
    network_mode: host
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dwh_user
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    secrets:
      - clickhouse_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config.d:/etc/clickhouse-server/config.d:ro
