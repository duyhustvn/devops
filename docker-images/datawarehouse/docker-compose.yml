networks:
  dwh-network:
    name: dwh-network
    driver: bridge

volumes:
  clickhouse_data:
    name: dwh_clickhouse_data
  clickhouse_logs:
    name: dwh_clickhouse_logs
  superset_pgdata:
    name: dwh_superset_pgdata
  superset_home:
    name: dwh_superset_home
  redis_data:
    name: dwh_redis_data

services:
  # ========================================================
  # CLICKHOUSE - Analytical OLAP Database (DWH Storage)
  # Tag: 26.4 (ClickHouse quy ước tag theo Năm.Tháng YY.MM)
  # ========================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.4
    container_name: dwh-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP Interface (Superset kết nối qua port này)
      - "9000:9000"   # Native Client Port (CLI / TCP)
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dwh_user
      CLICKHOUSE_PASSWORD: dwh_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - dwh-network

  # ========================================================
  # POSTGRESQL - Metadata Database cho Superset
  # Tag: 16 (Debian standard, không dùng Alpine)
  # ========================================================
  superset-db:
    image: postgres:16
    container_name: dwh-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - superset_pgdata:/var/lib/postgresql/data
    networks:
      - dwh-network

  # ========================================================
  # REDIS - Cache & Message Broker cho Superset
  # Tag: 8 (Debian standard, không dùng Alpine)
  # ========================================================
  superset-redis:
    image: redis:8
    container_name: dwh-superset-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - dwh-network

  # ========================================================
  # SUPERSET INIT - Tự động migrate DB và tạo tài khoản Admin
  # Base Image: apache/superset:6.1.0 (Build từ ./superset/Dockerfile)
  # ========================================================
  superset-init:
    build:
      context: ./superset
    container_name: dwh-superset-init
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET_KEY_12345"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_password
      ADMIN_FIRSTNAME: Admin
      ADMIN_LASTNAME: User
      ADMIN_EMAIL: admin@example.com
    entrypoint: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin --username $${ADMIN_USERNAME} --firstname $${ADMIN_FIRSTNAME} --lastname $${ADMIN_LASTNAME} --email $${ADMIN_EMAIL} --password $${ADMIN_PASSWORD} || true &&
        superset init
      "
    volumes:
      - superset_home:/app/superset_home
    networks:
      - dwh-network

  # ========================================================
  # SUPERSET APP - Giao diện Web Superset
  # Base Image: apache/superset:6.1.0 (Build từ ./superset/Dockerfile)
  # ========================================================
  superset:
    build:
      context: ./superset
    container_name: dwh-superset-app
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "CHANGE_ME_TO_A_COMPLEX_RANDOM_SECRET_KEY_12345"
    volumes:
      - superset_home:/app/superset_home
    networks:
      - dwh-network
