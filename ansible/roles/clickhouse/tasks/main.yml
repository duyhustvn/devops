---
# tasks file for clickhouse

- name: Create deployment directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: yes
  loop:
    - "{{ clickhouse_deploy_dir }}"
    - "{{ clickhouse_deploy_dir }}/config.d"
    - "{{ clickhouse_deploy_dir }}/secrets"
    - "{{ clickhouse_deploy_dir }}/haproxy"
    - "{{ clickhouse_deploy_dir }}/keepalived"
  tags: [config]

- name: Generate clickhouse secrets
  template:
    src: clickhouse_password.txt.j2
    dest: "{{ clickhouse_deploy_dir }}/secrets/clickhouse_password.txt"
    mode: "0600"
    owner: root
    group: root
  tags: [config]

- name: Generate keeper.xml configuration
  template:
    src: keeper.xml.j2
    dest: "{{ clickhouse_deploy_dir }}/config.d/keeper.xml"
    mode: "0644"
    owner: root
    group: root
  tags: [config]

- name: Generate cluster.xml configuration
  template:
    src: cluster.xml.j2
    dest: "{{ clickhouse_deploy_dir }}/config.d/cluster.xml"
    mode: "0644"
    owner: root
    group: root
  tags: [config]

- name: Generate haproxy.cfg configuration
  template:
    src: haproxy.cfg.j2
    dest: "{{ clickhouse_deploy_dir }}/haproxy/haproxy.cfg"
    mode: "0644"
    owner: root
    group: root
  tags: [config]

- name: Generate keepalived.conf configuration
  template:
    src: keepalived.conf.j2
    dest: "{{ clickhouse_deploy_dir }}/keepalived/keepalived.conf"
    mode: "0644"
    owner: root
    group: root
  tags: [config]

- name: Copy keepalived Dockerfile and health check script
  copy:
    src: "{{ item.src }}"
    dest: "{{ clickhouse_deploy_dir }}/keepalived/{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { src: "Dockerfile", dest: "Dockerfile", mode: "0644" }
    - { src: "check_haproxy.sh", dest: "check_haproxy.sh", mode: "0755" }
  tags: [config]

- name: Generate docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ clickhouse_deploy_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  tags: [config]

- name: Deploy ClickHouse Cluster (with HAProxy & Keepalived)
  shell: |
    docker compose up -d --build --force-recreate
  args:
    chdir: "{{ clickhouse_deploy_dir }}"
  register: clickhouse_deploy_result
  tags: [deploy]

- name: Debug deploy result
  debug:
    var: clickhouse_deploy_result
  tags: [deploy]
